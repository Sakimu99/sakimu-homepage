# Cloudflare Pages 项目配置（绑定与公开变量通过本文件管理）
# 部署：push 到 GitHub main 分支后由 Pages 自动构建（构建命令 npm run build，输出 dist）
name = "sakimu-homepage"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-19"

# 公开变量（不含任何密钥）
[vars]
PUBLIC_BASE_URL = "https://sakimu.cn"
ALIPAY_ENV = "prod"
ALIPAY_APP_ID = "2021007103657649"
ALIPAY_PUBLIC_KEY = ""
DEPOSIT_AMOUNT = "5.00"
DEPOSIT_SUBJECT = "咲梦工作室 · 项目预定定金"
DEPOSIT_TIMEOUT = "30m"
# 移动端收银台：wap = 手机网站支付（自动唤起支付宝 App，已开通）
#                page = 电脑网站支付（手机上显示扫码/账户登录收银台，作为回退）
ALIPAY_MOBILE_METHOD = "wap"

# 订单存储：/api/* 的 Pages Functions 通过 env.ORDERS 读写
[[kv_namespaces]]
binding = "ORDERS"
id = "323e71d54f644c789c8eb9e67cfce17f"

# 机密（用 wrangler 写入，不落仓库）：
#   wrangler pages secret put ALIPAY_PRIVATE_KEY --project-name sakimu-homepage
#   wrangler pages secret put ADMIN_TOKEN        --project-name sakimu-homepage
